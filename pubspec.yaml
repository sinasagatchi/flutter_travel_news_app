name: flutter_travel_news_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  card_swiper: ^3.0.1
  device_preview: ^1.2.0
  device_preview_screenshot: ^1.0.0
  flutter_svg: ^2.0.9
  go_router: ^12.1.1
  google_fonts: ^6.1.0
  share_plus: ^10.1.4
  
dev_dependencies:
  flutter_lints: ^3.0.0
  share_plus_platform_interface: ^5.0.2
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: CustomIcons
      fonts:
        - asset: fonts/CustomIcons.ttf